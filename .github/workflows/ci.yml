name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  api:
    name: api (${{ matrix.check }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    strategy:
      # Report every failing check in one run, not just the first.
      fail-fast: false
      matrix:
        check: [lint, format, typecheck, test, coverage]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        if: matrix.check == 'lint'
        run: ruff check .

      - name: Format (black)
        if: matrix.check == 'format'
        run: black --check .

      - name: Type-check (mypy strict)
        if: matrix.check == 'typecheck'
        run: mypy app

      - name: Test (pytest)
        if: matrix.check == 'test'
        # Includes app/tests/test_architecture.py, which enforces the layering
        # rules described in the README.
        run: pytest

      # Two separate runs, not one combined total. A single blanket percentage
      # would let one directory sag while the other carries it, and these are
      # exactly the paths where that must not happen: calc tools produce numbers
      # that end up on drawings, and guardrails decide whether the assistant is
      # allowed to answer at all.
      - name: Coverage — calc tools (>=95%)
        if: matrix.check == 'coverage'
        run: pytest --cov=app.ai.tools --cov-report=term-missing --cov-fail-under=95

      - name: Coverage — cite-or-refuse guardrails (>=95%)
        if: matrix.check == 'coverage'
        run: pytest --cov=app.ai.guardrails --cov-report=term-missing --cov-fail-under=95

  web:
    name: web (${{ matrix.check }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, format, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install
        run: npm ci

      - name: Lint (eslint)
        if: matrix.check == 'lint'
        run: npm run lint

      - name: Format (prettier)
        if: matrix.check == 'format'
        run: npm run format:check

      - name: Type-check (tsc)
        if: matrix.check == 'typecheck'
        run: npm run typecheck

      - name: Test (vitest)
        if: matrix.check == 'test'
        # Deliberately NOT `npm test`. The root script uses --if-present, which
        # exits 0 when a workspace has no test script — so a missing or deleted
        # test suite would pass silently. Targeting the workspace directly means
        # removing the script breaks the build.
        run: npm run test --workspace @panelpilot/web

  docker-build:
    name: docker build (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The API has no workspace dependencies, so its context is its own
          # directory. The web build context must be the repo root: apps/web
          # depends on the @panelpilot/shared-types workspace and the only
          # lockfile lives at the root.
          - image: api
            context: ./apps/api
            file: ./apps/api/Dockerfile
            target: runtime
          - image: web
            context: .
            file: ./apps/web/Dockerfile
            target: runner
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.image }} (target=${{ matrix.target }})
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          # Proving the production-shaped image still builds is the whole point;
          # nothing is pushed or loaded.
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  api-integration:
    name: api (integration)
    runs-on: ubuntu-latest
    # Retrieval's acceptance criterion is "the expected chunk is in the top 3",
    # which only a real search engine can answer. These tests skip locally when
    # no OpenSearch is reachable; here one always is, so they always run.
    services:
      opensearch:
        image: opensearchproject/opensearch:2.17.1
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: 'true'
          DISABLE_INSTALL_DEMO_CONFIG: 'true'
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ['9200:9200']
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 40s
      # BE-007's acceptance criterion is a concurrency invariant: no item is
      # ever assigned to two verifiers. Only a real database can answer that —
      # SQLite has no row-level locking and serialises writes, so the test
      # would pass against it whether or not the code is correct.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: panelpilot
          POSTGRES_PASSWORD: panelpilot
          POSTGRES_DB: panelpilot
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U panelpilot -d panelpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql+psycopg://panelpilot:panelpilot@localhost:5432/panelpilot
      # Read by the verification queue tests to decide whether the concurrency
      # suite can run. Separate from DATABASE_URL so a developer can point the
      # app at one database and the destructive queue tests at another.
      TEST_DATABASE_URL: postgresql+psycopg://panelpilot:panelpilot@localhost:5432/panelpilot
      OPENSEARCH_URL: http://localhost:9200
      REDIS_URL: redis://localhost:6379/0
      ANTHROPIC_API_KEY: ci-placeholder
      JWT_SECRET: ci-placeholder
      # A throwaway index name so a run can never touch a real corpus.
      OPENSEARCH_PRODUCTION_INDEX: panelpilot-ci-production
      OPENSEARCH_STAGING_INDEX: panelpilot-ci-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Integration tests (real OpenSearch)
        run: pytest app/tests/ai/retrieval -q
      - name: Fail if the integration tests silently skipped
        # A skip here would mean the service container was unreachable and the
        # acceptance criterion went unverified while the job still went green.
        run: |
          set -euo pipefail
          pytest app/tests/ai/retrieval -q -rs 2>&1 | tee /tmp/out.txt
          if grep -q "needs a reachable OpenSearch" /tmp/out.txt; then
            echo "::error::integration tests skipped -- OpenSearch was not reachable"
            exit 1
          fi
      - name: Concurrency tests (real Postgres)
        run: alembic upgrade head && pytest app/tests/domain/test_verification_queue.py app/tests/domain/test_ingestion_wiring.py app/tests/domain/test_feedback.py -q
      - name: Fail if the concurrency tests silently skipped
        # Same reasoning as above, and it matters more here: these tests are
        # the only evidence that two verifiers cannot be handed the same item.
        run: |
          set -euo pipefail
          pytest app/tests/domain/test_verification_queue.py app/tests/domain/test_ingestion_wiring.py app/tests/domain/test_feedback.py -q -rs 2>&1 | tee /tmp/pg.txt
          if grep -q "needs Postgres" /tmp/pg.txt; then
            echo "::error::concurrency tests skipped -- Postgres was not reachable"
            exit 1
          fi

  compose-smoke:
    name: compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # OpenSearch refuses to start below this; the runner default (65530) is
      # too low. Docker Desktop sets it for you, CI does not.
      - name: Raise vm.max_map_count for OpenSearch
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Create .env
        # The committed example is the documented starting point; if it cannot
        # boot the stack, that is itself a defect worth failing on.
        run: cp .env.example .env

      - name: Start the stack
        run: docker compose up --build -d

      - name: Wait for every service to report healthy
        run: |
          set -uo pipefail
          services="postgres opensearch redis api web"
          deadline=$(( SECONDS + 420 ))
          while :; do
            pending=""
            for s in $services; do
              cid=$(docker compose ps -q "$s" || true)
              if [ -z "$cid" ]; then pending="$pending $s(missing)"; continue; fi
              status=$(docker inspect -f '{{ if .State.Health }}{{ .State.Health.Status }}{{ else }}no-healthcheck{{ end }}' "$cid")
              if [ "$status" != "healthy" ]; then pending="$pending $s($status)"; fi
            done
            if [ -z "$pending" ]; then
              echo "All services healthy after ${SECONDS}s"
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for:$pending"
              exit 1
            fi
            sleep 5
          done
          docker compose ps

      - name: Assert /health/ready reports every dependency up
        run: |
          set -euo pipefail
          body=$(curl -fsS http://localhost:8000/api/v1/health/ready)
          echo "$body"
          # Assert the dependencies individually. A 200 alone would pass even if
          # readiness had regressed into a stub that never checks anything.
          for expected in '"status":"up"' '"database":"up"' '"opensearch":"up"'; do
            echo "$body" | grep -q "$expected" || {
              echo "::error::readiness payload missing $expected"
              exit 1
            }
          done

      - name: Assert the web app serves a page
        run: curl -fsS -o /dev/null -w 'web HTTP %{http_code}\n' http://localhost:3000

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v

  migration-drift:
    name: migration drift
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: panelpilot
          POSTGRES_PASSWORD: panelpilot
          POSTGRES_DB: panelpilot
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U panelpilot -d panelpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      # Settings requires these; only DATABASE_URL is actually used here. They
      # are CI placeholders, not credentials.
      DATABASE_URL: postgresql+psycopg://panelpilot:panelpilot@localhost:5432/panelpilot
      # Read by the verification queue tests to decide whether the concurrency
      # suite can run. Separate from DATABASE_URL so a developer can point the
      # app at one database and the destructive queue tests at another.
      TEST_DATABASE_URL: postgresql+psycopg://panelpilot:panelpilot@localhost:5432/panelpilot
      OPENSEARCH_URL: http://localhost:9200
      REDIS_URL: redis://localhost:6379/0
      ANTHROPIC_API_KEY: ci-placeholder
      JWT_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"

      - name: Apply migrations
        run: alembic upgrade head

      - name: Round-trip the head migration against populated tables
        # BE-014: an irreversible or broken downgrade must fail here, not when
        # someone needs to roll back a deploy.
        #
        # Order matters. The seed goes in AFTER the downgrade, not before: the
        # downgrade drops `tenants` and every `tenant_id` column, so anything
        # seeded first is destroyed and the re-upgrade runs against empty
        # tables again -- which is exactly the case that always passes.
        # Seeding post-downgrade means `upgrade head` has to backfill real rows
        # in every table the migration touches.
        run: |
          set -euo pipefail
          alembic downgrade -1
          python - <<'SEED'
          import os
          import psycopg

          # `alembic downgrade -1` rolls back only the head migration, so which
          # columns exist here depends on which migration is currently head.
          # Discover them rather than assuming: hardcoding the shape meant this
          # seed broke the moment a new migration landed on top.
          dsn = os.environ["DATABASE_URL"].replace("postgresql+psycopg://", "postgresql://")
          with psycopg.connect(dsn, autocommit=True) as conn:

              def columns(table):
                  rows = conn.execute(
                      "SELECT column_name FROM information_schema.columns "
                      "WHERE table_schema = 'public' AND table_name = %s",
                      (table,),
                  ).fetchall()
                  return {r[0] for r in rows}

              user_cols = columns("users")
              tenant_id = None
              if "tenant_id" in user_cols:
                  tenant_id = conn.execute(
                      "INSERT INTO tenants (id, slug, name, is_active, created_at, updated_at) "
                      "VALUES (gen_random_uuid(), 'ci-seed', 'CI seed', true, now(), now()) "
                      "ON CONFLICT (slug) DO NOTHING RETURNING id"
                  ).fetchone()
                  if tenant_id is None:
                      tenant_id = conn.execute(
                          "SELECT id FROM tenants WHERE slug = 'ci-seed'"
                      ).fetchone()
                  tenant_id = tenant_id[0]

              if tenant_id is not None:
                  user_id = conn.execute(
                      "INSERT INTO users (id, tenant_id, email, is_active, created_at, "
                      "updated_at) VALUES (gen_random_uuid(), %s, "
                      "'ci-seed@example.invalid', true, now(), now()) RETURNING id",
                      (tenant_id,),
                  ).fetchone()[0]
              else:
                  user_id = conn.execute(
                      "INSERT INTO users (id, email, is_active, created_at, updated_at) "
                      "VALUES (gen_random_uuid(), 'ci-seed@example.invalid', true, now(), "
                      "now()) RETURNING id"
                  ).fetchone()[0]

              # Every table the migration adds tenant_id to must hold rows, or
              # its backfill is only ever exercised empty.
              session_cols = columns("diagnostic_sessions")
              if "tenant_id" in session_cols:
                  session_id = conn.execute(
                      "INSERT INTO diagnostic_sessions (id, tenant_id, user_id, created_at, "
                      "updated_at) VALUES (gen_random_uuid(), %s, %s, now(), now()) "
                      "RETURNING id",
                      (tenant_id, user_id),
                  ).fetchone()[0]
              else:
                  session_id = conn.execute(
                      "INSERT INTO diagnostic_sessions (id, user_id, created_at, updated_at) "
                      "VALUES (gen_random_uuid(), %s, now(), now()) RETURNING id",
                      (user_id,),
                  ).fetchone()[0]

              conn.execute(
                  "INSERT INTO diagnostic_turns (id, session_id, position, question, answer, "
                  "created_at, updated_at) VALUES (gen_random_uuid(), %s, 1, 'q', 'a', "
                  "now(), now())",
                  (session_id,),
              )

              calc_cols = columns("calculation_records")
              if "tenant_id" in calc_cols:
                  conn.execute(
                      "INSERT INTO calculation_records (id, tenant_id, user_id, kind, "
                      "created_at, updated_at) VALUES (gen_random_uuid(), %s, %s, "
                      "'cable_sizing', now(), now())",
                      (tenant_id, user_id),
                  )
              else:
                  conn.execute(
                      "INSERT INTO calculation_records (id, user_id, kind, created_at, "
                      "updated_at) VALUES (gen_random_uuid(), %s, 'cable_sizing', now(), "
                      "now())",
                      (user_id,),
                  )
          SEED
          alembic upgrade head

      - name: Assert the backfill actually populated every scoped table
        # A migration that adds the column but silently leaves it NULL would
        # pass `upgrade head`; only checking the data catches that.
        run: |
          set -euo pipefail
          python - <<'CHECK'
          import os
          import sys
          import psycopg

          dsn = os.environ["DATABASE_URL"].replace("postgresql+psycopg://", "postgresql://")
          failures = []
          with psycopg.connect(dsn) as conn:
              for table in ("users", "diagnostic_sessions", "calculation_records"):
                  total = conn.execute(f"SELECT count(*) FROM {table}").fetchone()[0]
                  nulls = conn.execute(
                      f"SELECT count(*) FROM {table} WHERE tenant_id IS NULL"
                  ).fetchone()[0]
                  if total == 0:
                      failures.append(f"{table}: no rows, backfill never exercised")
                  if nulls:
                      failures.append(f"{table}: {nulls} rows left with a null tenant_id")
          if failures:
              for line in failures:
                  print(f"::error::{line}")
              sys.exit(1)
          print("every scoped table backfilled with no nulls")
          CHECK

      - name: Check for model drift
        # Catches a model edited without a matching migration — the failure mode
        # that otherwise only appears when someone deploys.
        run: |
          set -uo pipefail
          # alembic check exits non-zero on drift, so capture before asserting.
          output=$(alembic check 2>&1 || true)
          echo "$output"
          echo "$output" | grep -q "No new upgrade operations detected" || {
            echo "::error::Models have drifted from migrations. Run: alembic revision --autogenerate -m '...' (then format the result)"
            exit 1
          }

  shared-types-drift:
    name: shared types drift
    runs-on: ubuntu-latest
    env:
      # Settings requires these; dumping the schema touches no service. CI
      # placeholders, not credentials.
      DATABASE_URL: postgresql+psycopg://placeholder:placeholder@localhost:5432/placeholder
      OPENSEARCH_URL: http://localhost:9200
      REDIS_URL: redis://localhost:6379/0
      ANTHROPIC_API_KEY: ci-placeholder
      JWT_SECRET: ci-placeholder-secret-at-least-32-bytes-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install API
        working-directory: apps/api
        run: pip install -e ".[dev]"
      - name: Install workspace
        run: npm ci
      # The same command a developer runs, so the check cannot disagree with
      # the fix it tells them to apply.
      - name: Regenerate the types
        working-directory: packages/shared-types
        run: npm run generate
      - name: Fail if the checked-in types were stale
        run: |
          if ! git diff --exit-code -- packages/shared-types/src/api.generated.ts; then
            echo
            echo "packages/shared-types/src/api.generated.ts is out of date."
            echo "The frontend would compile against a shape the API no longer"
            echo "returns. Regenerate it and commit the result:"
            echo
            echo "  cd packages/shared-types && npm run generate"
            exit 1
          fi
      # A generator that silently produces nothing would make the diff above
      # pass forever. Assert it actually emitted the schema.
      - name: Check the generated file is not empty
        run: |
          lines=$(wc -l < packages/shared-types/src/api.generated.ts)
          if [ "$lines" -lt 100 ]; then
            echo "Generated types are only $lines lines — the generator failed."
            exit 1
          fi

  deps-audit:
    name: deps audit (${{ matrix.target }})
    runs-on: ubuntu-latest
    # Its own job on purpose: a newly published advisory against a dependency
    # should not be tangled up with, or masked by, an unrelated failing check.
    strategy:
      fail-fast: false
      matrix:
        target: [python, node]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: matrix.target == 'python'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Audit Python dependencies (pip-audit)
        if: matrix.target == 'python'
        working-directory: apps/api
        # --skip-editable: panelpilot-api itself is not on PyPI and cannot be
        # audited; its dependencies are what matter here.
        run: |
          pip install -e ".[dev]"
          pip-audit --skip-editable

      - uses: actions/setup-node@v4
        if: matrix.target == 'node'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Audit JS dependencies (npm audit)
        if: matrix.target == 'node'
        run: |
          npm ci
          npm audit --audit-level=high

  # Single required status check to protect main with — it turns green only
  # when every job above succeeded, so adding a check needs no branch
  # protection change. A job missing from `needs` runs but does not block
  # merging, which would make it decorative.
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs:
      [
        api,
        api-integration,
        web,
        docker-build,
        compose-smoke,
        migration-drift,
        shared-types-drift,
        deps-audit,
      ]
    if: always()
    steps:
      - name: Verify all checks passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more checks failed."
            exit 1
          fi
