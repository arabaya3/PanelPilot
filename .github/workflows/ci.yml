name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  api:
    name: api (${{ matrix.check }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    strategy:
      # Report every failing check in one run, not just the first.
      fail-fast: false
      matrix:
        check: [lint, format, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        if: matrix.check == 'lint'
        run: ruff check .

      - name: Format (black)
        if: matrix.check == 'format'
        run: black --check .

      - name: Type-check (mypy strict)
        if: matrix.check == 'typecheck'
        run: mypy app

      - name: Test (pytest)
        if: matrix.check == 'test'
        # Includes app/tests/test_architecture.py, which enforces the layering
        # rules described in the README.
        run: pytest

  web:
    name: web (${{ matrix.check }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, format, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install
        run: npm ci

      - name: Lint (eslint)
        if: matrix.check == 'lint'
        run: npm run lint

      - name: Format (prettier)
        if: matrix.check == 'format'
        run: npm run format:check

      - name: Type-check (tsc)
        if: matrix.check == 'typecheck'
        run: npm run typecheck

  # Single required status check to protect main with — it turns green only
  # when every matrix job above succeeded, so adding a check needs no branch
  # protection change.
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [api, web]
    if: always()
    steps:
      - name: Verify all checks passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more checks failed."
            exit 1
          fi
