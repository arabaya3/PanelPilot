[project]
name = "panelpilot-api"
version = "0.1.0"
description = "PanelPilot API — AI diagnostic and design copilot for electrical/control engineers."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    # Multipart form parsing, required by FastAPI for file uploads (BE-009).
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "bcrypt>=4.2",
    "pyjwt>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "opensearch-py>=2.7",
    "structlog>=24.4",
    "anthropic>=0.40",
    "httpx>=0.27",
    # PDF layout extraction for the ingestion pipeline (BE-005). MIT, and
    # chosen over PyMuPDF because that is AGPL-or-commercial. Surfaces font
    # size and table ruling lines, which is what makes heading levels and
    # atomic blocks detectable rather than guessed.
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pip-audit>=2.7",
    # Builds fixture PDFs for the structure-extractor tests. A real PDF is
    # the only honest fixture here: the whole point of the extractor is that
    # it reads layout, and a hand-built StructureMap would test nothing.
    "reportlab>=4.2",
    "ruff>=0.7",
    "black>=24.10",
    "mypy>=1.13",
]

# Two runtimes, one package. See docs/adr/0002-one-package-two-runtimes.md.
[project.scripts]
panelpilot-worker = "app.worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Formatting / linting
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtin shadowing
    "C4",       # comprehensions
    "PT",       # pytest style
    "SIM",      # simplify
    "TID",      # tidy imports
    "ARG",      # unused arguments
    "PTH",      # use pathlib
    "RUF",
    "D",        # pydocstyle — docstrings are a hard requirement in domain/ and ai/
]
ignore = [
    "D100",  # module docstring handled per-directory below
    "D104",  # package docstring on __init__ not required everywhere
    "E501",  # line length is black's job
]

# Standards citations quote clause ranges as printed — "Tables B.52.2–B.52.5",
# "methods A1–G". The en dash is correct typography there, so allow it rather
# than degrading the citation to match the linter.
allowed-confusables = ["–"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Route files are thin; they still document themselves but need no arg-level docs.
"app/api/**" = ["D103"]
# Tests document themselves through their names.
"app/tests/**" = ["D101", "D102", "D103", "ARG001"]
"alembic/**" = ["D", "N999", "ARG001"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ---------------------------------------------------------------------------
# Typing
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = false
plugins = ["pydantic.mypy"]
exclude = "^alembic/"

[[tool.mypy.overrides]]
module = ["opensearchpy.*", "reportlab.*", "pdfplumber.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["app/tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
