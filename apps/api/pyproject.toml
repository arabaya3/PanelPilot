[project]
name = "panelpilot-api"
version = "0.1.0"
description = "PanelPilot API — AI diagnostic and design copilot for electrical/control engineers."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    # Multipart form parsing, required by FastAPI for file uploads (BE-009).
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "bcrypt>=4.2",
    "pyjwt>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "opensearch-py>=2.7",
    "structlog>=24.4",
    "anthropic>=0.40",
    # The alternative model provider (LLM_PROVIDER=openai), and its
    # embeddings (EMBEDDING_PROVIDER=openai). Apache-2.0.
    "openai>=1.50",
    "httpcore>=1.0",
    "httpx>=0.27",
    # PDF layout extraction for the ingestion pipeline (BE-005). MIT, and
    # chosen over PyMuPDF because that is AGPL-or-commercial. Surfaces font
    # size and table ruling lines, which is what makes heading levels and
    # atomic blocks detectable rather than guessed.
    "pdfplumber>=0.11",
    # Renders the drawing set (app/design/render_pdf.py). BSD. Also builds
    # the structure extractor's fixture PDFs: a real PDF is the only honest
    # fixture there, since the extractor's whole job is reading layout.
    "reportlab>=4.2",
    # Reads a consultant's load schedule from Excel (app/design/
    # schedule_import.py), the form most of them arrive in. MIT.
    "openpyxl>=3.1",
    # IEC 61131-3 Structured Text parsing for PLC validation (AI-009). MIT.
    #
    # A general parser toolkit rather than a PLC library, deliberately. The
    # one real Python ST parser, blark, is GPL — the same disqualification
    # that ruled out PyMuPDF above. lark is what blark itself is built on, so
    # this is the same engine with a grammar written here instead of
    # inherited under a licence the product cannot take.
    "lark>=1.2",
    # Dense embeddings for retrieval's vector leg. Anthropic publishes no
    # embeddings API, so this is a second vendor by necessity rather than
    # preference. Voyage's default output width is 1024, which is what
    # `mappings.EMBEDDING_DIMENSIONS` already pins — so adopting it needs no
    # re-index.
    "voyageai>=0.3",
    # Shared sliding-window store for the trial rate limit (BE-012), so the
    # limit is per deployment rather than per worker. MIT.
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pip-audit>=2.7",
    # Reads back the DXF export in its tests: a drawing AutoCAD's format
    # rules reject would pass any check written here by hand. MIT.
    "ezdxf>=1.3",
    # In-process Redis for the rate-limit store's tests: real sorted-set and
    # MULTI semantics without a server. BSD-3.
    "fakeredis>=2.26",
    # A throwaway CA for the crawler's TLS test: proves a pinned connection
    # still verifies the certificate against the original name. MIT/Apache-2.
    "trustme>=1.2",
    "ruff>=0.7",
    "black>=24.10",
    "mypy>=1.13",
]

# Two runtimes, one package. See docs/adr/0002-one-package-two-runtimes.md.
[project.scripts]
panelpilot-worker = "app.worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Formatting / linting
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtin shadowing
    "C4",       # comprehensions
    "PT",       # pytest style
    "SIM",      # simplify
    "TID",      # tidy imports
    "ARG",      # unused arguments
    "PTH",      # use pathlib
    "RUF",
    "D",        # pydocstyle — docstrings are a hard requirement in domain/ and ai/
]
ignore = [
    "D100",  # module docstring handled per-directory below
    "D104",  # package docstring on __init__ not required everywhere
    "E501",  # line length is black's job
]

# Standards citations quote clause ranges as printed — "Tables B.52.2–B.52.5",
# "methods A1–G". The en dash is correct typography there, so allow it rather
# than degrading the citation to match the linter.
allowed-confusables = ["–"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Route files are thin; they still document themselves but need no arg-level docs.
"app/api/**" = ["D103"]
# Tests document themselves through their names.
"app/tests/**" = ["D101", "D102", "D103", "ARG001"]
"alembic/**" = ["D", "N999", "ARG001"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ---------------------------------------------------------------------------
# Typing
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = false
plugins = ["pydantic.mypy"]
exclude = "^alembic/"

[[tool.mypy.overrides]]
module = ["opensearchpy.*", "reportlab.*", "pdfplumber.*", "voyageai.*", "openpyxl.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["app/tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
