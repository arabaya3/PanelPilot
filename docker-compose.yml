# PanelPilot — LOCAL DEVELOPMENT ONLY.
#
# This file is not a deployment artefact and must never be used as one. It runs
# OpenSearch with security disabled and ships placeholder database credentials
# in plain text; both are acceptable on a laptop and unacceptable anywhere else.
#
#   cp .env.example .env
#   docker compose up --build
#
# Only the web service publishes a port. Everything else is reachable only on
# the internal network, by service name.

name: panelpilot

services:
  # ---------------------------------------------------------------------------
  # Postgres — primary database.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Dev-only placeholders. Nothing here is a secret and nothing here is
      # reused anywhere else.
      POSTGRES_USER: panelpilot
      POSTGRES_PASSWORD: panelpilot
      POSTGRES_DB: panelpilot
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready, not a port check: the container accepts connections well
      # before the database is ready to answer them.
      test: ['CMD-SHELL', 'pg_isready -U panelpilot -d panelpilot']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [panelpilot]

  # ---------------------------------------------------------------------------
  # OpenSearch — retrieval index.
  #
  # DEV ONLY. Security is disabled, so this node has no authentication, no TLS,
  # and no authorisation. It is a single node with no replicas. Never run this
  # configuration anywhere reachable by anything but your own machine.
  # ---------------------------------------------------------------------------
  opensearch:
    image: opensearchproject/opensearch:2.17.1
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - bootstrap.memory_lock=true
      # Capped deliberately: OpenSearch defaults to half the host's RAM, which
      # on a dev machine starves everything else in this file.
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9200/_cluster/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks: [panelpilot]

  # ---------------------------------------------------------------------------
  # Redis — rate limiting and cached lookups.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Persistence on, so a restart does not silently reset rate-limit state
    # mid-session and make a bug impossible to reproduce.
    command: ['redis-server', '--save', '60', '1', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [panelpilot]

  # ---------------------------------------------------------------------------
  # API — FastAPI, hot-reloading against the mounted source.
  # ---------------------------------------------------------------------------
  api:
    build:
      # apps/api has no workspace dependencies, so its context is its own
      # directory and apps/api/.dockerignore applies.
      context: ./apps/api
      target: dev
    restart: unless-stopped
    env_file: .env
    environment:
      # These three override .env on purpose: .env.example cannot know the
      # compose service names, and a developer should not have to hand-edit
      # their .env to make `docker compose up` work.
      # Pinned so a pre-existing .env from before the dev|staging|prod rename
      # cannot fail the stack with an enum error.
      ENVIRONMENT: dev
      DATABASE_URL: postgresql+psycopg://panelpilot:panelpilot@postgres:5432/panelpilot
      OPENSEARCH_URL: http://opensearch:9200
      REDIS_URL: redis://redis:6379/0
    # DEV ONLY. Migrations run here, in the compose override, and deliberately
    # NOT in the Dockerfile's CMD — the runtime stage is the production image,
    # and a container that migrates its own database on boot is a container
    # that can rewrite schema during a rolling deploy, from however many
    # replicas happen to start at once. Production runs `alembic upgrade head`
    # as a separate, ordered step before any new code serves traffic.
    #
    # Here it removes a real footgun: a fresh volume starts at the initial
    # revision, and every auth route 500s on a missing column until someone
    # remembers to run it by hand. `exec` so uvicorn keeps PID 1 and still
    # receives signals; `&&` so a failed migration stops the container instead
    # of serving traffic against a schema that does not match the code.
    command:
      - /bin/sh
      - -c
      - >-
        alembic upgrade head &&
        exec uvicorn app.main:create_app --factory
        --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app
    volumes:
      # Source mounted for --reload.
      - ./apps/api:/app
      # Anonymous volume masks the host virtualenv: those are host-platform
      # binaries and must never shadow the container's venv at /opt/venv.
      - /app/.venv
    depends_on:
      postgres: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      # Defined here rather than inherited: the dev target is a separate branch
      # of the Dockerfile and does not carry the runtime stage's HEALTHCHECK.
      # /health/ready returns 503 until Postgres and OpenSearch both answer, so
      # this gates on real readiness rather than "the process started".
      test:
        [
          'CMD',
          'python',
          '-c',
          "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:8000' + os.environ.get('API_V1_PREFIX', '/api/v1') + '/health/ready', timeout=4)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    # Published to the host because NEXT_PUBLIC_API_BASE_URL is inlined into the
    # browser bundle, and a browser cannot resolve the internal http://api:8000.
    # Container-to-container traffic still uses the service name; this mapping
    # exists for the browser, curl, and OpenAPI clients running on the host.
    ports:
      - '8000:8000'
    networks: [panelpilot]

  # ---------------------------------------------------------------------------
  # Web — next dev with hot reload. The production standalone image is the
  # `runner` target in apps/web/Dockerfile; it is what ships, not what runs here.
  # ---------------------------------------------------------------------------
  web:
    build:
      # Context is the repo root: apps/web depends on the shared-types
      # workspace and the lockfile lives at the root.
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      NEXT_TELEMETRY_DISABLED: '1'
      # Read by the browser, not by this container, so it must be an address
      # the host can resolve.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      # Where the Next server forwards /api/* to. A container hostname, not
      # localhost: the rewrite runs server-side, so it resolves on the compose
      # network rather than in the browser. The browser only ever talks to
      # this origin, which is what keeps the requests same-origin and out of
      # CORS entirely.
      API_PROXY_TARGET: http://api:8000
    volumes:
      - ./apps/web:/repo/apps/web
      - ./packages:/repo/packages
      # /repo itself is not mounted, so the hoisted /repo/node_modules from the
      # image stays intact. Only .next needs masking: the host has its own build
      # output from running next build locally, and it must not shadow the
      # container's.
      - /repo/apps/web/.next
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      # Without this, `docker compose ps` can only ever report web as "running",
      # so there is no way to tell a served page from a crash loop.
      # busybox wget, already in node:alpine — nothing extra installed.
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:3000/']
      interval: 10s
      timeout: 5s
      retries: 6
      # next dev compiles the first request on demand, so the first probe can
      # legitimately be slow on a cold start.
      start_period: 45s
    ports:
      - '3000:3000'
    networks: [panelpilot]

networks:
  panelpilot:
    driver: bridge

volumes:
  postgres-data:
  opensearch-data:
  redis-data:
